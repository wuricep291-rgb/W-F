<!-- HALAMAN 5: PENUTUP, COUNTDOWN & RSVP PAS DI BAWAH KERTAS AMPLOP -->
  <div class="page-section" style="position: relative;">
    <img src="5.jpg" alt="Halaman Penutup" class="design-img">

    <!-- Container Melayang di Atas Background Hijau Gambar 5.jpg -->
    <div class="overlay-content">
      
      <!-- Widget Countdown -->
      <div class="countdown-container">
        <div class="countdown-title">Hitung Mundur Acara</div>
        <div class="countdown-grid">
          <div class="cd-box"><div class="cd-number" id="cd-days">00</div><div class="cd-label">Hari</div></div>
          <div class="cd-box"><div class="cd-number" id="cd-hours">00</div><div class="cd-label">Jam</div></div>
          <div class="cd-box"><div class="cd-number" id="cd-mins">00</div><div class="cd-label">Menit</div></div>
          <div class="cd-box"><div class="cd-number" id="cd-secs">00</div><div class="cd-label">Detik</div></div>
        </div>
      </div>

      <!-- Form RSVP -->
      <div id="rsvp-section">
        <div class="rsvp-title">Konfirmasi Kehadiran</div>
        <form id="rsvp-form">
          <div class="form-group">
            <label for="f-nama">Nama Lengkap</label>
            <input type="text" id="f-nama" name="nama" required placeholder="Tulis nama Anda...">
          </div>
          <div class="form-group">
            <label for="f-kehadiran">Konfirmasi Kehadiran</label>
            <select id="f-kehadiran" name="kehadiran" required>
              <option value="Hadir">Insya Allah Hadir</option>
              <option value="Tidak Hadir">Tidak Dapat Hadir</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-jumlah">Jumlah Tamu (Termasuk Anda)</label>
            <input type="number" id="f-jumlah" name="jumlahTamu" value="1" min="1" max="5">
          </div>
          <div class="form-group">
            <label for="f-pesan">Ucapan &amp; Doa Restu</label>
            <textarea id="f-pesan" name="pesan" rows="3" required placeholder="Tulis ucapan dan doa Anda..."></textarea>
          </div>
          <button type="submit" id="rsvp-submit" class="btn-submit">KIRIM KONFIRMASI</button>
          <div id="rsvp-status" style="text-align:center; font-size:0.8rem; margin-top:10px; color: var(--gold-light);"></div>
        </form>
      </div>

    </div>
  </div>
